name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"
    # Weekly full-suite gate: Sunday 03:00 UTC. Drives the blocking
    # full-suite-weekly job below (matched via github.event.schedule).
    - cron: "0 3 * * 0"

jobs:
  fast-gate:
    name: Fast gate (offline, no network, no slow)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run fast-gate test suite
        run: python -m pytest tests/ -m "not network and not slow" -v --tb=short

  full-suite:
    name: Full suite (network + slow, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Only run on push to main and on the nightly schedule; not on every PR.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run full test suite (may hit network)
        run: python -m pytest tests/ -v --tb=short

  full-suite-weekly:
    name: Full suite weekly (network + slow, blocking)
    runs-on: ubuntu-latest
    # The full-suite job above sets continue-on-error: true, so network+slow
    # regressions can never block a merge and produce no signal. This weekly
    # scheduled job runs the identical suite WITHOUT continue-on-error so
    # those regressions surface as a red, blocking result.
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run full test suite (blocking)
        run: python -m pytest tests/ -v --tb=short
